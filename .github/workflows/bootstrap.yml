name: Bootstrap benchmark project

on:
  push:
    branches: [main]
    paths:
      - bootstrap.ready

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'chore: trigger benchmark bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand benchmark archive
        run: |
          cat project.part*.b64 | base64 --decode > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .

      - name: Commit benchmark baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f bootstrap.ready project.part*.b64
          git add -A
          git commit -m "feat: add ontology GraphRAG Codex benchmark baseline"
          git push
